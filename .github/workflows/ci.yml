# CI：JVM 单测（Robolectric）+ Android Lint。Gradle 根在 src/（仓库根没有 gradlew）
name: CI

on:
  push:
    branches: [main, 'feat/**', 'ci/**', 'legacy/**']
  pull_request:

# 同一 ref 的新推送取消旧 run，节省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: JVM 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 赋予 Gradle wrapper 执行权限
        run: chmod +x gradlew

      - name: 安装 JDK 17（temurin）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 运行单元测试
        # :app 的 JVM 单测 + :shared 的纯逻辑单测一起跑（桌面迁移 M1 起，见根目录 迁移方案-桌面Windows版.md）
        run: ./gradlew :app:testDebugUnitTest :shared:test --continue --stacktrace

      - name: 上传本轮 JVM 与视觉验收证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-evidence
          path: |
            src/app/build/test-results/testDebugUnitTest/**
            src/shared/build/test-results/test/**
            src/app/build/ui-render-probe/**
            src/shared/build/reader-bootstrap-golden/**
          if-no-files-found: warn

      # :shared 存在的唯一意义是「零 Android 依赖」，这条红线由 CI 机械执法（src/shared/README.md 规则 1）
      - name: :shared 纯净性检查
        if: ${{ !cancelled() }}
        run: |
          if grep -rE '^import (android|androidx)\.' shared/src/main; then
            echo "::error :::shared 不得 import android.*/androidx.*（见 src/shared/README.md 规则 1）"
            exit 1
          fi

      # 第四轮审查 6-12：PIPELINE_VERSION 在 Kotlin 与 Python 生成器里各有一份，
      # 任一侧 bump 忘改另一侧只会「响亮失败」（找不到目录/拒装），但没人希望踩。
      # 键派生的一致性子由 :shared 的 AudioPackGeneratorContractTest 对拍（上面那步已跑）。
      - name: 朗读管线版本两侧一致（Kotlin ↔ Python 生成器）
        if: ${{ !cancelled() }}
        run: |
          kt=$(grep -oE 'VERSION[[:space:]]*=[[:space:]]*[0-9]+' shared/src/main/java/com/linguareader/shared/tts/TtsPipelineContract.kt | grep -oE '[0-9]+' | head -1)
          py=$(grep -oE '^PIPELINE_VERSION[[:space:]]*=[[:space:]]*[0-9]+' ../scripts/build_audio_pack.py | grep -oE '[0-9]+' | head -1)
          echo "Kotlin TtsPipelineContract.VERSION=$kt / Python PIPELINE_VERSION=$py"
          if [ -z "$kt" ] || [ -z "$py" ] || [ "$kt" != "$py" ]; then
            echo "::error ::朗读管线版本两侧不一致（Kotlin=$kt，Python=$py）——改切分/片段规则必须同时 +1 并同步 build_audio_pack.py"
            exit 1
          fi

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 赋予 Gradle wrapper 执行权限
        run: chmod +x gradlew

      - name: 安装 JDK 17（temurin）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 2026-11-25 本地及 CI 已实际通过（0 errors）；后续错误必须阻断。
      - name: 运行 Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: 上传 lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-debug
          path: |
            src/app/build/reports/lint-results-debug.html
            src/app/build/reports/lint-results-debug.xml
          if-no-files-found: warn

  resource-tools:
    name: 资源发布工具检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 JDK 17（temurin）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: 资源发布与归档测试
        run: node --test scripts/publish_packs.test.mjs deploy/packs/package.test.mjs

      - name: 资源激活逻辑测试
        run: python3 deploy/packs/test_activate.py

      - name: 安装脚本语法检查
        run: bash -n deploy/packs/install-ubuntu.sh
