# CI：JVM 单测（Robolectric）+ Android Lint。Gradle 根在 src/（仓库根没有 gradlew）
name: CI

on:
  push:
    branches: [main, 'feat/**', 'ci/**', 'legacy/**']
  pull_request:

# 同一 ref 的新推送取消旧 run，节省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: JVM 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 赋予 Gradle wrapper 执行权限
        run: chmod +x gradlew

      - name: 安装 JDK 17（temurin）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 运行单元测试
        # :app 的 JVM 单测 + :shared 的纯逻辑单测一起跑（桌面迁移 M1 起，见根目录 迁移方案-桌面Windows版.md）
        run: ./gradlew testDebugUnitTest :shared:test --stacktrace

      # :shared 存在的唯一意义是「零 Android 依赖」，这条红线由 CI 机械执法（src/shared/README.md 规则 1）
      - name: :shared 纯净性检查
        run: |
          if grep -rE '^import (android|androidx)\.' shared/src/main; then
            echo "::error :::shared 不得 import android.*/androidx.*（见 src/shared/README.md 规则 1）"
            exit 1
          fi

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 赋予 Gradle wrapper 执行权限
        run: chmod +x gradlew

      - name: 安装 JDK 17（temurin）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 首轮先观察不阻断：开发机是离线环境（lint-gradle 依赖不在本地缓存里），
      # 这一步的真实结果只能由 CI 跑出来。等 CI 跑过一轮、确认 error 数为 0
      # （或据报告补好 src/app/lint-baseline.xml）之后，删掉 continue-on-error
      # 这一行，lint 即成为硬门禁。lint 配置见 src/app/build.gradle.kts 的 lint{}。
      - name: 运行 Android Lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug --stacktrace

      - name: 上传 lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-debug
          path: |
            src/app/build/reports/lint-results-debug.html
            src/app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
