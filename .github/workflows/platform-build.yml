# 三平台（Windows / Linux / macOS）桌面端构建与产物归档。
# jpackage 只能为宿主 OS 打包，所以必须用三个 OS 的 runner 矩阵；Android 单测仍在 ci.yml。
name: Platform Build

on:
  push:
    branches: [main, feat/**, ci/**]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: 桌面构建 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: src
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 JDK 17（temurin）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Gradle 的仓库列表把阿里云镜像放在最前（仓库既定配置，不改），镜像是 CDN，
      # 偶发 502 会让整次解析失败（2026-09-20 windows job 实测）。故对每条 Gradle
      # 命令做有限重试，而不是改仓库配置或放宽断言。
      - name: 共享内核单测
        run: |
          chmod +x gradlew || true
          ok=0
          for i in 1 2 3; do
            if ./gradlew :shared:test --stacktrace; then ok=1; break; fi
            echo "第 $i 次失败（可能是镜像 502），15 秒后重试"
            sleep 15
          done
          [ "$ok" = "1" ]

      - name: 桌面壳单测
        run: |
          ok=0
          for i in 1 2 3; do
            if ./gradlew :desktopApp:test --stacktrace; then ok=1; break; fi
            echo "第 $i 次失败，15 秒后重试"
            sleep 15
          done
          [ "$ok" = "1" ]

      # 用 ::error 注解输出失败用例名：注解可通过 check-runs API 匿名读取，
      # 而 job 日志需要 token。诊断步骤自身永不失败（exit 0）。
      - name: 失败时汇总失败用例（无日志环境也能定位）
        if: failure()
        shell: bash
        run: |
          set +e
          cat > report_failures.py <<'PYEOF'
          import glob, sys, xml.etree.ElementTree as ET
          # Windows 的 stdout 默认 cp1252，断言消息里的中文会让 print 抛 UnicodeEncodeError，
          # 于是诊断步骤自己失败、注解丢失。强制 UTF-8。
          try:
              sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          except Exception:
              pass
          bad = 0
          for path in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for tc in root.iter('testcase'):
                  node = tc.find('failure')
                  if node is None:
                      node = tc.find('error')
                  if node is None:
                      continue
                  bad += 1
                  msg = (node.get('message') or '') or (node.text or '')
                  flat = ' '.join(msg.strip().split())
                  name = (tc.get('classname') or '') + '.' + (tc.get('name') or '')
                  print('::error title=TESTFAIL::' + name + ' | ' + flat[:400])
          if bad == 0:
              print('::error title=TESTFAIL::no failing testcase xml found')
          PYEOF
          if command -v python3 >/dev/null 2>&1; then python3 report_failures.py; else python report_failures.py; fi
          rm -f report_failures.py
          exit 0

      - name: 构建可分发目录（app-image，三平台通用）
        run: |
          ok=0
          for i in 1 2 3; do
            if ./gradlew :desktopApp:createDistributable --stacktrace; then ok=1; break; fi
            echo "第 $i 次失败，15 秒后重试"
            sleep 15
          done
          [ "$ok" = "1" ]

      - name: 构建当前平台安装包（Windows=Exe / macOS=Dmg / Linux=Deb）
        run: |
          ok=0
          for i in 1 2 3; do
            if ./gradlew :desktopApp:packageDistributionForCurrentOS --stacktrace; then ok=1; break; fi
            echo "第 $i 次失败，15 秒后重试"
            sleep 15
          done
          [ "$ok" = "1" ]

      # 「可运行」冒烟：直接跑打包产物（自带运行时 + 应用类 + 数据目录读写）。
      # 无头自检，不建窗口；它证明二进制能在该 OS 起来，不证明 GUI 渲染。
      - name: 运行冒烟（打包产物 --selftest）
        run: |
          APP=desktopApp/build/compose/binaries/main/app/LinguaReader
          if [ -d "$APP.app" ]; then
            LAUNCHER="$APP.app/Contents/MacOS/LinguaReader"
          elif [ -x "$APP/bin/LinguaReader" ]; then
            LAUNCHER="$APP/bin/LinguaReader"
          elif [ -x "$APP/LinguaReader.exe" ]; then
            LAUNCHER="$APP/LinguaReader.exe"
          else
            echo "找不到打包启动器；目录内容："
            find "$APP" -maxdepth 3 | head -30
            exit 1
          fi
          echo "launcher=$LAUNCHER"
          "$LAUNCHER" --selftest "$RUNNER_TEMP/lr-selftest-smoke"

      - name: 列出构建产物
        run: find desktopApp/build/compose/binaries -type f | grep -E '[.](deb|rpm|AppImage|msi|exe|dmg|pkg)$' || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: LinguaReader-${{ matrix.os }}
          path: src/desktopApp/build/compose/binaries/main/**
          if-no-files-found: error
