# 三平台（Windows / Linux / macOS）桌面端构建与产物归档。
# jpackage 只能为宿主 OS 打包，所以必须用三个 OS 的 runner 矩阵；Android 单测仍在 ci.yml。
name: Platform Build

on:
  push:
    branches: [main, feat/**, ci/**]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: 桌面构建 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: src
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 JDK 17（temurin）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 拆成两步：无日志环境下也能从步骤结论判断是内核还是桌面壳失败。
      - name: 共享内核单测
        run: |
          chmod +x gradlew || true
          ./gradlew :shared:test --stacktrace

      - name: 桌面壳单测
        run: ./gradlew :desktopApp:test --stacktrace

      # 用 ::error 注解输出失败用例名：注解可通过 check-runs API 匿名读取，
      # 而 job 日志需要 token。诊断步骤自身永不失败（exit 0）。
      - name: 失败时汇总失败用例（无日志环境也能定位）
        if: failure()
        shell: bash
        run: |
          set +e
          cat > report_failures.py <<'PYEOF'
          import glob, xml.etree.ElementTree as ET
          bad = 0
          for path in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for tc in root.iter('testcase'):
                  node = tc.find('failure')
                  if node is None:
                      node = tc.find('error')
                  if node is None:
                      continue
                  bad += 1
                  msg = (node.get('message') or '') or (node.text or '')
                  flat = ' '.join(msg.strip().split())
                  name = (tc.get('classname') or '') + '.' + (tc.get('name') or '')
                  print('::error title=TESTFAIL::' + name + ' | ' + flat[:400])
          if bad == 0:
              print('::error title=TESTFAIL::no failing testcase xml found')
          PYEOF
          if command -v python3 >/dev/null 2>&1; then python3 report_failures.py; else python report_failures.py; fi
          rm -f report_failures.py
          exit 0

      - name: 构建可分发目录（app-image，三平台通用）
        run: ./gradlew :desktopApp:createDistributable --stacktrace

      - name: 构建当前平台安装包（Windows=Exe / macOS=Dmg / Linux=Deb）
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS --stacktrace

      - name: 列出构建产物
        run: find desktopApp/build/compose/binaries -type f | grep -E '[.](deb|rpm|AppImage|msi|exe|dmg|pkg)$' || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: LinguaReader-${{ matrix.os }}
          path: src/desktopApp/build/compose/binaries/main/**
          if-no-files-found: error
