<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>TTS 音色试听台 · MiMo</title>
<style>
  :root {
    --bg: #0b0d14;
    --card: #171a26;
    --card-2: #1c2030;
    --border: #262c3e;
    --border-2: #333a52;
    --text: #e8ecf6;
    --muted: #8f96ac;
    --accent: #6c8cff;
    --accent-2: #9a6cff;
    --green: #3ecf8e;
    --red: #ff6b6b;
    --amber: #ffb454;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 10px 34px rgba(0, 0, 0, 0.42);
    --mono: "Cascadia Code", "Consolas", "SF Mono", "JetBrains Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1100px 500px at 12% -8%, rgba(108,140,255,0.10), transparent 60%),
      radial-gradient(900px 440px at 88% -6%, rgba(154,108,255,0.10), transparent 60%),
      linear-gradient(180deg, #0b0d14 0%, #10131d 100%);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 30px 22px 70px; }

  header { margin-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand .logo {
    width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center;
    font-size: 22px; background: linear-gradient(140deg, var(--accent), var(--accent-2));
    box-shadow: 0 8px 22px rgba(108,140,255,.28);
  }
  h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .meta { margin-top: 12px; font-size: 12px; color: var(--muted); }
  code { font-family: var(--mono); font-size: 12px; color: var(--text); }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 14px; margin: 0 0 12px; letter-spacing: .3px; }
  .card h3 {
    font-size: 12px; margin: 16px 0 8px; color: var(--muted);
    font-weight: 600; letter-spacing: .6px; text-transform: uppercase;
  }
  .hint { color: var(--muted); font-size: 12px; margin: 10px 0 0; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row > .grow { flex: 1 1 220px; min-width: 0; }

  input[type="text"], input[type="password"], textarea, select {
    width: 100%;
    background: #10131d;
    border: 1px solid var(--border-2);
    border-radius: var(--radius-sm);
    color: var(--text);
    padding: 9px 11px;
    font-size: 13px;
    font-family: inherit;
  }
  textarea { min-height: 62px; resize: vertical; }
  input::placeholder, textarea::placeholder { color: #5b6178; }

  .btn {
    border: 1px solid var(--border-2);
    background: var(--card-2);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background: #232839; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary {
    background: linear-gradient(140deg, var(--accent), var(--accent-2));
    border-color: transparent;
    color: #fff;
    font-weight: 600;
  }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .voice {
    display: flex; align-items: center; gap: 10px;
    background: var(--card-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 12px;
  }
  .voice .info { flex: 1 1 0; min-width: 0; }
  .voice .name { font-size: 13px; font-weight: 600; }
  .voice .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
  .tag {
    font-size: 10px; color: var(--muted); border: 1px solid var(--border-2);
    border-radius: 999px; padding: 1px 7px;
  }
  .voice .actions { display: flex; flex-direction: column; gap: 6px; }
  .voice .actions .btn { padding: 6px 10px; font-size: 12px; }
  .voice.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

  pre.config {
    margin: 0 0 12px; padding: 12px 14px; background: #10131d;
    border: 1px solid var(--border-2); border-radius: var(--radius-sm);
    font-family: var(--mono); font-size: 12px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-all; color: var(--text);
  }

  .status {
    margin-top: 6px; font-size: 12px; min-height: 18px; color: var(--muted);
  }
  .status.error { color: var(--red); }
  .status.ok { color: var(--green); }
  .status.busy { color: var(--amber); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">🎙</div>
      <div>
        <h1>TTS 音色试听台 · MiMo</h1>
        <p class="sub">小米 MiMo-V2.5-TTS · 预置 / 设计 / 克隆音色</p>
      </div>
    </div>
    <div class="meta">引擎端点 <code id="base-url">加载中…</code></div>
  </header>

  <section class="card">
    <h2>API Key</h2>
    <div class="row">
      <div class="grow">
        <label class="sr-only" for="api-key">MiMo API Key</label>
        <input id="api-key" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false">
      </div>
      <button id="save-key" class="btn primary" type="button">保存</button>
      <span id="key-state" class="hint" style="margin:0"></span>
    </div>
    <p class="hint">只保存在浏览器 localStorage，服务端不落盘、不写日志。</p>
  </section>

  <section class="card">
    <h2>试听样例 / 风格指令</h2>
    <div class="row">
      <div class="grow">
        <label class="sr-only" for="sample-zh">中文样例</label>
        <input id="sample-zh" type="text" placeholder="中文试听样例">
      </div>
      <div class="grow">
        <label class="sr-only" for="sample-en">英文样例</label>
        <input id="sample-en" type="text" placeholder="English sample">
      </div>
    </div>
    <p class="hint" style="margin:12px 0 6px">风格指令（可选，预置音色生效）</p>
    <label class="sr-only" for="style">风格指令</label>
    <textarea id="style" placeholder="例如：用轻快、亲切的语气朗读"></textarea>
  </section>

  <section class="card">
    <h2>预置音色</h2>
    <h3>中文</h3>
    <div id="zh-voices" class="grid"></div>
    <h3>英文</h3>
    <div id="en-voices" class="grid"></div>
  </section>

  <section class="card">
    <h2>设计音色（voicedesign）</h2>
    <p class="hint" style="margin-top:0">用自然语言描述生成专属音色，试听不落盘。</p>
    <div class="row" style="margin-top:12px">
      <div class="grow">
        <label class="sr-only" for="design-desc">音色描述</label>
        <input id="design-desc" type="text" placeholder="例如：温柔知性的中年女性，语速偏慢，适合朗读小说">
      </div>
      <button id="design-play" class="btn primary" type="button">试听</button>
    </div>
  </section>

  <section class="card">
    <h2>克隆音色（voiceclone）</h2>
    <p class="hint" style="margin-top:0">上传一段 mp3 / wav 样本（≤10 MB）复刻音色，样本只在这次请求里传给 MiMo。</p>
    <div class="row" style="margin-top:12px">
      <label class="btn" for="clone-file">选择样本文件</label>
      <input id="clone-file" type="file" accept="audio/*" class="sr-only">
      <span id="clone-name" class="hint" style="margin:0"></span>
      <button id="clone-play" class="btn primary" type="button" disabled>试听</button>
    </div>
  </section>

  <section class="card">
    <h2>复制配置</h2>
    <pre class="config" id="config">—</pre>
    <div class="row">
      <button id="copy" class="btn primary" type="button">复制</button>
      <span class="hint" style="margin:0">中文默认 <code id="zh-default">mimo_default</code> · 英文默认 <code id="en-default">Mia</code></span>
    </div>
  </section>

  <div id="status" class="status" role="status" aria-live="polite"></div>
</div>

<script>
(function () {
  "use strict";

  var KEY_STORAGE = "studio.mimoApiKey";
  var PREF_STORAGE = "studio.prefs";
  var DEFAULT_SAMPLES = {
    zh: "今天天气很好，我们一起读一本英文小说吧。",
    en: "The lantern flickered once, and the library fell silent.",
  };

  var catalog = null;
  var prefs = readPrefs();
  var apiKey = readKey();
  var cloneSample = { name: "", base64: "" };
  var playing = null;
  var playingUrl = null;

  var el = {
    baseUrl: document.getElementById("base-url"),
    apiKey: document.getElementById("api-key"),
    saveKey: document.getElementById("save-key"),
    keyState: document.getElementById("key-state"),
    sampleZh: document.getElementById("sample-zh"),
    sampleEn: document.getElementById("sample-en"),
    style: document.getElementById("style"),
    zhVoices: document.getElementById("zh-voices"),
    enVoices: document.getElementById("en-voices"),
    designDesc: document.getElementById("design-desc"),
    designPlay: document.getElementById("design-play"),
    cloneFile: document.getElementById("clone-file"),
    cloneName: document.getElementById("clone-name"),
    clonePlay: document.getElementById("clone-play"),
    config: document.getElementById("config"),
    copy: document.getElementById("copy"),
    zhDefault: document.getElementById("zh-default"),
    enDefault: document.getElementById("en-default"),
    status: document.getElementById("status"),
  };

  /* ---------- storage ---------- */
  function readKey() {
    try { return window.localStorage.getItem(KEY_STORAGE) || ""; } catch (e) { return ""; }
  }
  function readPrefs() {
    var fallback = { style: "", samples: Object.assign({}, DEFAULT_SAMPLES), zhVoice: "mimo_default", enVoice: "Mia" };
    try {
      var raw = window.localStorage.getItem(PREF_STORAGE);
      if (!raw) return fallback;
      var parsed = JSON.parse(raw) || {};
      return {
        style: typeof parsed.style === "string" ? parsed.style : "",
        samples: Object.assign({}, DEFAULT_SAMPLES, parsed.samples || {}),
        zhVoice: parsed.zhVoice || "mimo_default",
        enVoice: parsed.enVoice || "Mia",
      };
    } catch (e) {
      return fallback;
    }
  }
  function savePrefs() {
    try { window.localStorage.setItem(PREF_STORAGE, JSON.stringify(prefs)); } catch (e) { /* 隐私模式 */ }
    renderConfig();
  }

  /* ---------- ui ---------- */
  function setStatus(message, kind) {
    el.status.textContent = message || "";
    el.status.className = "status" + (kind ? " " + kind : "");
  }
  function refreshKeyState() {
    el.keyState.textContent = apiKey ? "已保存" : "未填写";
    el.keyState.style.color = apiKey ? "var(--green)" : "var(--muted)";
  }

  /* ---------- audio ---------- */
  function stopAudio() {
    if (playing) {
      try { playing.pause(); } catch (e) { /* 已结束 */ }
      playing = null;
    }
    if (playingUrl) {
      try { window.URL.revokeObjectURL(playingUrl); } catch (e) { /* 已释放 */ }
      playingUrl = null;
    }
  }
  function playBlob(blob) {
    stopAudio();
    var url = window.URL.createObjectURL(blob);
    playingUrl = url;
    var audio = new window.Audio(url);
    playing = audio;
    audio.onended = function () {
      window.URL.revokeObjectURL(url);
      if (playing === audio) playing = null;
      if (playingUrl === url) playingUrl = null;
    };
    audio.play().catch(function () {
      window.URL.revokeObjectURL(url);
      if (playingUrl === url) playingUrl = null;
    });
  }

  /* ---------- api ---------- */
  function preview(voice, label) {
    if (!apiKey) {
      setStatus("请先填写并保存 MiMo API Key", "error");
      el.apiKey.focus();
      return;
    }
    var language = voice.language || "zh";
    var text = (language === "en" ? el.sampleEn.value : el.sampleZh.value).trim();
    if (!text) {
      setStatus("请先填写试听样例文本", "error");
      return;
    }
    var payload = {
      api_key: apiKey,
      text: text,
      style: el.style.value,
      voice: { kind: voice.kind || "preset", id: voice.id || "" },
    };
    if (voice.kind === "design") payload.voice.description = voice.description || "";
    if (voice.kind === "clone") {
      payload.voice.sample_base64 = cloneSample.base64;
      payload.voice.sample_name = cloneSample.name;
    }
    setStatus("合成中… " + (label || ""), "busy");
    window.fetch("/api/preview", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    }).then(function (response) {
      if (!response.ok) {
        return response.json().catch(function () { return {}; }).then(function (body) {
          throw new Error(body.error || ("HTTP " + response.status));
        });
      }
      return response.blob();
    }).then(function (blob) {
      playBlob(blob);
      setStatus("已播放 " + (label || ""), "ok");
    }).catch(function (error) {
      setStatus("试听失败：" + error.message, "error");
    });
  }

  /* ---------- rendering ---------- */
  function voiceCard(voice, language) {
    var card = document.createElement("div");
    card.className = "voice";
    var info = document.createElement("div");
    info.className = "info";
    var name = document.createElement("div");
    name.className = "name";
    name.textContent = voice.name || voice.id;
    info.appendChild(name);
    var tags = document.createElement("div");
    tags.className = "tags";
    var chips = [language === "en" ? "英文" : "中文", voice.gender === "male" ? "男" : "女"].concat(voice.style || []);
    chips.forEach(function (chip) {
      var span = document.createElement("span");
      span.className = "tag";
      span.textContent = chip;
      tags.appendChild(span);
    });
    info.appendChild(tags);
    card.appendChild(info);

    var actions = document.createElement("div");
    actions.className = "actions";
    var play = document.createElement("button");
    play.type = "button";
    play.className = "btn";
    play.textContent = "试听";
    play.addEventListener("click", function () { preview({ kind: "preset", id: voice.id, language: language }, voice.id); });
    actions.appendChild(play);

    var setDefault = document.createElement("button");
    setDefault.type = "button";
    setDefault.className = "btn";
    setDefault.textContent = language === "en" ? "设为英文默认" : "设为中文默认";
    setDefault.addEventListener("click", function () {
      if (language === "en") prefs.enVoice = voice.id; else prefs.zhVoice = voice.id;
      savePrefs();
      markDefaults();
      setStatus("已把 " + voice.id + " 设为" + (language === "en" ? "英文" : "中文") + "默认音色", "ok");
    });
    actions.appendChild(setDefault);
    card.appendChild(actions);
    card.dataset.voiceId = voice.id;
    return card;
  }

  function markDefaults() {
    el.zhDefault.textContent = prefs.zhVoice;
    el.enDefault.textContent = prefs.enVoice;
    Array.prototype.forEach.call(document.querySelectorAll(".voice"), function (card) {
      card.classList.toggle("active", card.dataset.voiceId === prefs.zhVoice || card.dataset.voiceId === prefs.enVoice);
    });
  }

  function renderConfig() {
    var models = (catalog && catalog.models) || {};
    var lines = [
      "# LinguaReader 听书 · MiMo 云 TTS 配置",
      "引擎: MiMo",
      "Base URL: " + ((catalog && catalog.base_url) || "https://api.xiaomimimo.com/v1"),
      "模型: " + (models.preset || "mimo-v2.5-tts"),
      "中文音色: " + prefs.zhVoice,
      "英文音色: " + prefs.enVoice,
      "风格指令: " + (prefs.style.trim() || "（留空）"),
      "API Key: （在试听台里已保存，请自行粘贴）",
    ];
    el.config.textContent = lines.join("\n");
  }

  function renderCatalog() {
    el.baseUrl.textContent = catalog.base_url;
    el.zhVoices.innerHTML = "";
    el.enVoices.innerHTML = "";
    (catalog.presets || []).forEach(function (voice) {
      var language = voice.language === "en" ? "en" : "zh";
      (language === "en" ? el.enVoices : el.zhVoices).appendChild(voiceCard(voice, language));
    });
    markDefaults();
    renderConfig();
  }

  /* ---------- events ---------- */
  el.saveKey.addEventListener("click", function () {
    apiKey = el.apiKey.value.trim();
    try { window.localStorage.setItem(KEY_STORAGE, apiKey); } catch (e) { /* 隐私模式 */ }
    refreshKeyState();
    setStatus(apiKey ? "API Key 已保存到本机浏览器" : "已清空 API Key", apiKey ? "ok" : "");
  });
  el.sampleZh.addEventListener("input", function () { prefs.samples.zh = el.sampleZh.value; savePrefs(); });
  el.sampleEn.addEventListener("input", function () { prefs.samples.en = el.sampleEn.value; savePrefs(); });
  el.style.addEventListener("input", function () { prefs.style = el.style.value; savePrefs(); });

  el.designPlay.addEventListener("click", function () {
    var description = el.designDesc.value.trim();
    if (!description) { setStatus("请先填写音色描述", "error"); return; }
    preview({ kind: "design", description: description, language: "zh" }, "设计音色");
  });

  el.cloneFile.addEventListener("change", function () {
    var file = el.cloneFile.files && el.cloneFile.files[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) {
      setStatus("样本超过 10 MB 上限", "error");
      cloneSample = { name: "", base64: "" };
      el.cloneName.textContent = "";
      el.clonePlay.disabled = true;
      return;
    }
    var reader = new window.FileReader();
    reader.onload = function () {
      var result = String(reader.result || "");
      var comma = result.indexOf(",");
      cloneSample = { name: file.name, base64: comma >= 0 ? result.slice(comma + 1) : "" };
      el.cloneName.textContent = file.name + " · " + Math.round(file.size / 1024) + " KB";
      el.clonePlay.disabled = cloneSample.base64 === "";
    };
    reader.readAsDataURL(file);
  });

  el.clonePlay.addEventListener("click", function () {
    if (!cloneSample.base64) { setStatus("请先选择样本文件", "error"); return; }
    preview({ kind: "clone", sample_name: cloneSample.name, language: "zh" }, "克隆音色");
  });

  el.copy.addEventListener("click", function () {
    var text = el.config.textContent;
    var done = function () { setStatus("配置已复制到剪贴板", "ok"); };
    if (window.navigator.clipboard && window.navigator.clipboard.writeText) {
      window.navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  });
  function fallbackCopy(text, done) {
    var area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    try { document.execCommand("copy"); done(); } catch (e) { setStatus("复制失败，请手动选中复制", "error"); }
    document.body.removeChild(area);
  }

  /* ---------- boot ---------- */
  el.apiKey.value = apiKey;
  el.sampleZh.value = prefs.samples.zh;
  el.sampleEn.value = prefs.samples.en;
  el.style.value = prefs.style;
  refreshKeyState();

  window.fetch("/api/voices").then(function (response) { return response.json(); }).then(function (body) {
    catalog = body;
    renderCatalog();
    setStatus("已加载 " + (body.presets || []).length + " 个预置音色", "ok");
  }).catch(function (error) {
    setStatus("音色目录加载失败：" + error.message, "error");
  });
})();
</script>
</body>
</html>
